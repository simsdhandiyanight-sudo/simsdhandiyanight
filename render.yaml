services:
  - type: web
    name: sims-dhandiya-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: sims.dhandiyanight@gmail.com
      - key: BREVO_SENDER_NAME
        value: Soundarya Institute
      - key: BREVO_WEBHOOK_TOKEN
        sync: false

  - type: worker
    name: sims-dhandiya-email-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py process_ticket_emails --loop
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: DATABASE_URL
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: CORS_ALLOWED_ORIGINS
      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: CSRF_TRUSTED_ORIGINS
      - key: BREVO_API_KEY
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: BREVO_API_KEY
      - key: BREVO_SENDER_EMAIL
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: BREVO_SENDER_EMAIL
      - key: BREVO_SENDER_NAME
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: BREVO_SENDER_NAME
