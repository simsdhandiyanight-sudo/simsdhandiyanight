services:
  - type: web
    name: sims-dhandiya-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && python manage.py migrate_legacy_payment_proofs && python manage.py seed_dhandiya_event && python manage.py bootstrap_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      - key: PAYMENT_PROOF_RESERVATION_HOURS
        value: "24"
      - key: PAYMENT_PROOF_RESUBMISSION_HOURS
        value: "12"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DJANGO_INTERNAL_API_KEY
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_APPS_SCRIPT_WEBHOOK_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_WEBHOOK_SECRET
        sync: false
      - key: COLLEGE_TICKET_ID_PREFIX
        value: SIMS-DN
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@sims.in
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_RESET_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: SIMS Admin

  - type: cron
    name: sims-dhandiya-payment-proof-expiry
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py expire_payment_proof_reservations
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: DATABASE_URL

  - type: cron
    name: sims-dhandiya-payment-proof-cloudinary-cleanup
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "20 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py cleanup_orphaned_payment_proofs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: DATABASE_URL
      - key: CLOUDINARY_CLOUD_NAME
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: CLOUDINARY_API_SECRET
