services:
  - type: web
    name: sims-dhandiya-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate --noinput && python manage.py migrate_legacy_payment_proofs && python manage.py seed_dhandiya_event && python manage.py bootstrap_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      - key: PAYU_MERCHANT_KEY
        sync: false
      - key: PAYU_MERCHANT_SALT
        sync: false
      - key: PAYU_ENVIRONMENT
        value: test
      - key: PAYU_SUCCESS_URL
        sync: false
      - key: PAYU_FAILURE_URL
        sync: false
      - key: PAYU_WEBHOOK_URL
        sync: false
      - key: PAYU_FRONTEND_URL
        sync: false
      - key: PAYMENT_UPI_ID
        sync: false
      - key: PAYMENT_UPI_QR_IMAGE_URL
        sync: false
      - key: PAYMENT_PROOF_RESERVATION_HOURS
        value: "24"
      - key: PAYMENT_PROOF_RESUBMISSION_HOURS
        value: "12"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        value: sims.dhandiyanight@gmail.com
      - key: BREVO_SENDER_NAME
        value: Soundarya Institute
      - key: BREVO_WEBHOOK_TOKEN
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: admin@sims.in
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_RESET_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: SIMS Admin

  - type: worker
    name: sims-dhandiya-email-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py process_ticket_emails --loop
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: DATABASE_URL
      - key: ALLOWED_HOSTS
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: ALLOWED_HOSTS
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: CORS_ALLOWED_ORIGINS
      - key: CSRF_TRUSTED_ORIGINS
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: CSRF_TRUSTED_ORIGINS
      - key: BREVO_API_KEY
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: BREVO_API_KEY
      - key: BREVO_SENDER_EMAIL
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: BREVO_SENDER_EMAIL
      - key: BREVO_SENDER_NAME
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: BREVO_SENDER_NAME
      - key: PAYMENT_UPI_ID
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: PAYMENT_UPI_ID
      - key: PAYMENT_UPI_QR_IMAGE_URL
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: PAYMENT_UPI_QR_IMAGE_URL
      - key: PAYMENT_PROOF_RESERVATION_HOURS
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: PAYMENT_PROOF_RESERVATION_HOURS
      - key: PAYMENT_PROOF_RESUBMISSION_HOURS
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: PAYMENT_PROOF_RESUBMISSION_HOURS

  - type: cron
    name: sims-dhandiya-payment-proof-expiry
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py expire_payment_proof_reservations
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: DATABASE_URL

  - type: cron
    name: sims-dhandiya-payment-proof-cloudinary-cleanup
    runtime: python
    rootDir: backend
    plan: starter
    schedule: "20 3 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py cleanup_orphaned_payment_proofs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: SECRET_KEY
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: DATABASE_URL
      - key: CLOUDINARY_CLOUD_NAME
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: CLOUDINARY_CLOUD_NAME
      - key: CLOUDINARY_API_KEY
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
        fromService:
          type: web
          name: sims-dhandiya-api
          envVarKey: CLOUDINARY_API_SECRET
